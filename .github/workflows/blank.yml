name: PC Windows Virtual

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Informações do Sistema
      shell: powershell
      run: |
        Write-Host "=== PC WINDOWS VIRTUAL ===" -ForegroundColor Green
        Write-Host "Instance: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow

        Write-Host "`n=== ESPECIFICAÇÕES ===" -ForegroundColor Cyan
        Get-CimInstance Win32_OperatingSystem |
          Select-Object Caption, OSArchitecture,
          @{Name="RAM_GB";Expression={[math]::Round($_.TotalVisibleMemorySize / 1MB, 2)}}

        Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

    - name: Ativar Área de Trabalho Remota
      shell: powershell
      run: |
        Write-Host "Ativando RDP..." -ForegroundColor Green

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Write-Host "RDP ativado!" -ForegroundColor Green

    - name: Criar Usuário
      shell: powershell
      run: |
        $Username = "pcuser"
        $Password = ConvertTo-SecureString "PC@2026!Win" -AsPlainText -Force

        $ExistingUser = Get-LocalUser `
          -Name $Username `
          -ErrorAction SilentlyContinue

        if (-not $ExistingUser) {
          New-LocalUser `
            -Name $Username `
            -Password $Password `
            -PasswordNeverExpires `
            -AccountNeverExpires
        } else {
          Set-LocalUser `
            -Name $Username `
            -Password $Password
        }

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member $Username `
          -ErrorAction SilentlyContinue

        Write-Host "Usuário: $Username" -ForegroundColor Yellow
        Write-Host "Senha: PC@2026!Win" -ForegroundColor Yellow

    - name: Instalar Tailscale
      shell: powershell
      run: |
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
        $installer = "$env:TEMP\tailscale.msi"

        Write-Host "Baixando Tailscale..." -ForegroundColor Green

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$installer`" /quiet /norestart" `
          -Wait

        Remove-Item $installer -Force

        Write-Host "Tailscale instalado!" -ForegroundColor Green

    - name: Conectar Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

        & $Tailscale up `
          --authkey "$env:TAILSCALE_AUTH_KEY" `
          --hostname "pc-windows-${{ github.run_id }}"

        Start-Sleep -Seconds 10

    - name: Obter IP
      shell: powershell
      run: |
        $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

        $IP = (& $Tailscale ip -4).Trim()

        "TAILSCALE_IP=$IP" | Out-File `
          -FilePath $env:GITHUB_ENV `
          -Append

        Write-Host ""
        Write-Host "==============================" -ForegroundColor Cyan
        Write-Host "      PC WINDOWS VIRTUAL      " -ForegroundColor Cyan
        Write-Host "==============================" -ForegroundColor Cyan
        Write-Host "IP: $IP" -ForegroundColor Green
        Write-Host "Usuário: pcuser" -ForegroundColor Yellow
        Write-Host "Senha: PC@2026!Win" -ForegroundColor Yellow
        Write-Host "==============================" -ForegroundColor Cyan

    - name: Instalar Chrome
      shell: powershell
      run: |
        $url = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installer = "$env:TEMP\chrome.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $installer

        Start-Process `
          -FilePath $installer `
          -ArgumentList "/silent /install" `
          -Wait

        Remove-Item $installer -Force

        Write-Host "Chrome instalado!" -ForegroundColor Green

    - name: Manter PC Ativo
      shell: powershell
      run: |
        Write-Host ""
        Write-Host "PC virtual ativo por até 6 horas." -ForegroundColor Green
        Write-Host "IP: $env:TAILSCALE_IP" -ForegroundColor Cyan
        Write-Host "Usuário: pcuser" -ForegroundColor Yellow
        Write-Host "Senha: PC@2026!Win" -ForegroundColor Yellow

        while ($true) {
          Write-Host "PC ativo - $(Get-Date)" -ForegroundColor Green
          Start-Sleep -Seconds 60
        }
